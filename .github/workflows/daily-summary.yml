name: Daily Horizon Summary

on:
  schedule:
    # GitHub 的 schedule 使用 UTC，且不保证准点，实测排隊延迟可达 30 分钟以上。
    # 22:30 UTC = 北京时间 06:30，提前一小时触发以便延迟后仍在 07:30 前完成。
    - cron: '30 22 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # 只需要 DeepSeek 的 Key；它对应 config.github.json 里的 ai.api_key_env
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 以后想推送到飞书时，再添加这个 Secret 并把 webhook.enabled 改回 true
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Publish to Content Hub
        # 日报已写入 docs/_posts，此处转成响应式 HTML 推送到自有内容平台。
        # 失败不影响主流程（GitHub Pages 发布），但会在日志中显式报错。
        continue-on-error: true
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: python scripts/publish_hub.py

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
